[package]
name = "u6e-proto"
version = "1.0.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
aws-lc-rs = { version = "1.18", default-features = false, features = ["alloc", "aws-lc-sys"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"], optional = true }

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:aws-lc-rs"]
