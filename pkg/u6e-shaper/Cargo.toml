[package]
name = "u6e-shaper"
version = "1.0.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
libc = "0.2"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
u6e-proto = { path = "../u6e-proto", default-features = false }
