---
# A site file of the shape the RF planner reads and edits, for its tests and
# the replay example: two APs, with documentation addresses and names, and a
# made-up country (ZZ, a user-assigned code) whose channel table the tests
# and the replay give.
#
# The planner leaves alone what a comment holding "planner: fixed" marks: an
# AP's line keeps all its radios, a radio's line the radio, a channel line its
# channel and width, a txpower line that power. Comments say why a setting is
# what it is, never the channel numbers, which the planner may change.
u6e:
  # What gets built, each repository at the commit pinned here.
  build:
    user: builder
    gitea: https://git.example.org/team
    debian:
      path: /srv/build/u6e-debian
      repo: u6e-debian
      branch: main
      ref: 0000000000000000000000000000000000000000
    native: {ssh: builder@192.0.2.50, machine: u6e-build}
    persist: true

  # The Wi-Fi controller each AP's agent dials.
  controller:
    address: wifi-controller.example.org
    port: 8443
    key: {path: secret/wifi-controller, field: public_key_hex}

  management:
    vlan: 100
    gateway: 192.0.2.1
    dns: 192.0.2.53
    log_server: 192.0.2.10:514

  wifi:
    # The regulatory domain the radios run in.
    country: ZZ
    vlans:
      default: 101
      all: [101, 102]
    # Transmit power per radio in dBm.
    txpower: {"24": 20, "5": 23, "6": 18}
    mbssid_6ghz: true
    ssids:
      - name: Example Enterprise
        kind: ent
        bands: ["5", "6"]
        vlan: 101
      - name: Example Guest
        kind: sae
        bands: ["24", "5", "6"]
        vlan: 102
        passphrase: {path: secret/wlans, field: guest}
    # hostapd settings per radio, for every AP unless the AP sets its own.
    radios:
      "24": {hw_mode: g, channel: 6}

  aps:
    ap1:
      hostname: u6-ap1
      address: 192.0.2.16/24
      agent_key: {path: secret/u6e-agent/ap1, field: private_key_pem}
      stock_host_keys:
        - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDexample1
      led: "off"
      bss_colors: {"24": 1, "5": 2, "6": 3}
      radios:
        "5":
          hw_mode: a
          channel: 36
          ht_capab: "[HT40+]"
          ieee80211ac: 1
          vht_oper_chwidth: 1
          vht_oper_centr_freq_seg0_idx: 42
          he_oper_chwidth: 1
          he_oper_centr_freq_seg0_idx: 42
        # 160 MHz on a preferred scanning channel: each AP has a block of
        # its own, as clients lose frames between two APs on one.
        "6":
          hw_mode: a
          op_class: 134
          channel: 37
          he_oper_chwidth: 2
          he_oper_centr_freq_seg0_idx: 47
          he_6ghz_reg_pwr_type: 0
    ap2:
      hostname: u6-ap2
      address: 192.0.2.17/24
      agent_key: {path: secret/u6e-agent/ap2, field: private_key_pem}
      stock_host_keys:
        - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDexample2
      led: blue
      bss_colors: {"24": 4, "5": 5, "6": 6}
      radios:
        # The primary of a neighbouring 20/40 MHz BSS, which 802.11-2024
        # 11.15.3.2 makes this one's too.
        "5":
          hw_mode: a
          channel: 149  # planner: fixed
          no_pri_sec_switch: 1
          ht_capab: "[HT40+]"
          ieee80211ac: 1
          vht_oper_chwidth: 1
          vht_oper_centr_freq_seg0_idx: 155
          he_oper_chwidth: 1
          he_oper_centr_freq_seg0_idx: 155
        # 160 MHz on a preferred scanning channel, beside ap1's block.
        "6":
          hw_mode: a
          op_class: 134
          channel: 69
          he_oper_chwidth: 2
          he_oper_centr_freq_seg0_idx: 79
          he_6ghz_reg_pwr_type: 0

  # The test client the tools drive.
  test_client:
    ssh: tester@192.0.2.132
    iface: wlan0
