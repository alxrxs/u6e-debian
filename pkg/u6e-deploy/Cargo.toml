[package]
name = "u6e-deploy"
version = "1.0.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["alloc", "aws-lc-sys"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
u6e-proto = { path = "../u6e-proto" }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
# The tests run the runner against a controller in the same process.
u6e-controller = { path = "../u6e-controller" }
