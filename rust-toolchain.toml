# The Rust toolchain every build of this workspace uses (rustup reads this
# file), so a commit builds the same agent and controller on any machine.
# toolchain.env pins the rest of the cross toolchain.
[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
